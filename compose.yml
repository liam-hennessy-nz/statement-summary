services:
  # PostgreSQL Database
  db:
    image: postgres:latest
    container_name: statement_summary
    restart: no
    environment:
      POSTGRES_USER: ${STATEMENT_SUMMARY_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${STATEMENT_SUMMARY_DB_PASS:-password}
      POSTGRES_DB: ${STATEMENT_SUMMARY_DB_NAME:-statement_summary}
    ports:
      - ${STATEMENT_SUMMARY_DB_PORT:-5432}:${STATEMENT_SUMMARY_DB_PORT:-5432}
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
